sentence=Hardened, low-memory fork of BitBank's AnimatedGIF for MCUs (~13 KB RAM option, full 12-bit LZW, cooperative decoding).
paragraph=Experimental fork of bitbank2/AnimatedGIF adding memory-safety hardening, lazy dictionary reset, compact 16-bit and 12-bit packed LZW dictionaries, chunked pixel expansion, compile-time profiles, optional transient per-frame heap buffers (~664 B resident), and optional cooperative incremental frame decoding while preserving upstream API and FAST/Turbo mode.
